        let route = { page: "home", params: {} };
        let cart = JSON.parse(localStorage.getItem("elara_cart") || "[]");
        let wishlist = JSON.parse(localStorage.getItem("elara_wish") || "[]");

        // Header state

        let searchOpen = false;

        // Shop state

        // ============================================================
        //  PERSISTENCE
        // ============================================================
        function saveCart() {
            localStorage.setItem("elara_cart", JSON.stringify(cart));
        }
        function saveWish() {
            localStorage.setItem("elara_wish", JSON.stringify(wishlist));
        }

        // ============================================================
        //  UTILITIES
        // ============================================================
        function cartCount() {
            return cart.reduce((s, i) => s + i.qty, 0);
        }

        function showToast(msg) {
            const t = document.getElementById("toast");
            document.getElementById("toast-msg").textContent = msg;
            t.classList.add("show");
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove("show"), 2400);
        }

        function stars(r) {
            let s = "";
            for (let i = 1; i <= 5; i++) {
                if (i <= Math.floor(r)) s += `<i class="fas fa-star star-icon"></i>`;
                else if (i - r < 1)
                    s += `<i class="fas fa-star-half-alt star-icon"></i>`;
                else s += `<i class="far fa-star star-icon"></i>`;
            }
            return s;
        }

        function inWish(id) {
            return wishlist.some((p) => p.id === id);
        }

        function nav(page, params = {}) {
            route = { page, params };
            menuOpen = false;
            searchOpen = false;
            searchQ = "";
            window.scrollTo({ top: 0, behavior: "smooth" });
            render();
        }

        // ============================================================
        //  CART / WISH ACTIONS
        // ============================================================
        function addToCart(p) {
            const ex = cart.find((i) => i.id === p.id);
            if (ex) ex.qty++;
            else cart.push({ ...p, qty: 1 });
            saveCart();
            renderHeader();
            showToast(`${p.name} added to cart`);
        }

        function removeCart(id) {
            cart = cart.filter((i) => i.id !== id);
            saveCart();
            renderPage();
            renderHeader();
        }

        function setQty(id, q) {
            if (q <= 0) {
                removeCart(id);
                return;
            }
            const i = cart.find((i) => i.id === id);
            if (i) {
                i.qty = q;
                saveCart();
                renderPage();
            }
        }

        function toggleWish(p) {
            if (inWish(p.id)) {
                wishlist = wishlist.filter((w) => w.id !== p.id);
                showToast(`Removed from wishlist`);
            } else {
                wishlist.push(p);
                showToast(`${p.name} added to wishlist`);
            }
            saveWish();
            renderPage();
        }

        // ============================================================
        //  PRODUCT CARD
        // ============================================================
        function productCard(p, gridClass = "") {
            const sale = p.orig !== null;
            const wished = inWish(p.id);
            return `
      <div class="product-card ${gridClass}">
        <div class="img-wrap">
          <img src="${p.img}" class="prod-img" data-nav-product="${p.id}" alt="${p.name}" loading="lazy">
          ${sale ? '<span class="sale-badge">SALE</span>' : ""}
          <button class="wish-btn" data-wish="${p.id}">
            <i class="${wished ? "fas" : "far"} fa-heart" style="font-size:.85rem; color:${wished ? "var(--accent)" : "inherit"}"></i>
          </button>
          <div class="hover-cart">
            <button class="cart-btn" data-addcart="${p.id}">
              <i class="fas fa-shopping-bag"></i> Add to Cart
            </button>
          </div>
        </div>
        <div class="prod-info">
          <div class="prod-title" data-nav-product="${p.id}">${p.name}</div>
          <div class="rating">${stars(p.rating)}<span class="rating-text">${p.rating} (${p.reviews})</span></div>
          <div class="price-group">
            <span class="cur-price">$${p.price}</span>
            ${sale ? `<span class="old-price">$${p.orig}</span>` : ""}
          </div>
        </div>
        <button class="mobile-cart-btn" data-addcart="${p.id}">
          <i class="fas fa-shopping-bag"></i> Add to Cart
        </button>
      </div>`;
        }

        // ============================================================
        //  HEADER RENDER
        // ============================================================
        function renderHeader() {
            const cc = cartCount();
            const wc = wishlist.length;
            const pages = [
                { id: "home", label: "Home" },
                { id: "shop", label: "Shop" },
                { id: "about", label: "About" },
                { id: "journal", label: "Journal" },
                { id: "contact", label: "Contact" },
            ];

            const navLinks = pages
                .map(
                    (p) => `
        <span class="nav-link ${route.page === p.id ? "active" : ""}" data-nav="${p.id}">${p.label}</span>
      `,
                )
                .join("");

            const mobileItems = pages
                .map(
                    (p) => `
        <span class="mobile-nav-item ${route.page === p.id ? "active" : ""}" data-nav="${p.id}">${p.label}</span>
      `,
                )
                .join("");

            // Search results
            const filteredSearch =
                searchQ.trim().length > 1
                    ? PRODUCTS.filter((p) =>
                        p.name.toLowerCase().includes(searchQ.toLowerCase()),
                    ).slice(0, 5)
                    : [];

            const searchResultsHtml = searchOpen
                ? `
      <div class="search-panel">
        <div class="search-input-wrap">
          <i class="fas fa-search search-icon-left"></i>
          <input id="search-inp" class="search-input" type="text"
            placeholder="Search products…" value="${searchQ.replace(/"/g, "&quot;")}" autofocus>
        </div>
        ${filteredSearch.length > 0
                    ? `
        <div class="search-results">
          ${filteredSearch
                        .map(
                            (p) => `
          <button class="result-item" data-nav-product="${p.id}">
            <img src="${p.img}" class="result-img" alt="${p.name}">
            <div>
              <div class="result-name">${p.name}</div>
              <div class="result-price">$${p.price}</div>
            </div>
          </button>`,
                        )
                        .join("")}

        // ============================================================
        //  MAIN RENDER
        // ============================================================
        function renderPage() {
            let html = "";
            switch (route.page) {
                case "home":
                    html = pageHome();
                    break;
                case "shop":
                    html = pageShop();
                    break;
                case "product":
                    html = pageProduct();
                    break;
                case "cart":
                    html = pageCart();
                    break;
                case "wishlist":
                    html = pageWishlist();
                    break;
                case "checkout":
                    html = pageCheckout();
                    break;
                case "about":
                    html = pageAbout();
                    break;
                case "journal":
                    html = pageJournal();
                    break;
                case "contact":
                    html = pageContact();
                    break;
                case "order":
                    html = pageOrderSuccess();
                    break;
                default:
                    html = pageHome();
            }
            document.getElementById("page-content").innerHTML = html;
            attachPageEvents();
            animateVisible();
        }

        function render() {
            renderHeader();
            renderPage();
            renderFooter();
        }

        // ============================================================
        //  ATTACH PAGE EVENTS
        // ============================================================
        function attachPageEvents() {
            // Navigation
            document.querySelectorAll("#page-content [data-nav]").forEach((el) => {
                el.addEventListener("click", () => nav(el.dataset.nav));
            });
            document
                .querySelectorAll("#page-content [data-nav-product]")
                .forEach((el) => {
                    el.addEventListener("click", () =>
                        nav("product", { id: el.dataset.navProduct }),
                    );
                });

            // Cart actions
            document.querySelectorAll("[data-addcart]").forEach((btn) => {
                btn.addEventListener("click", (e) => {
                    e.stopPropagation();
                    const p = PRODUCTS.find((x) => x.id === btn.dataset.addcart);
                    if (p) addToCart(p);
                });
            });
            document.querySelectorAll("[data-wish]").forEach((btn) => {
                btn.addEventListener("click", (e) => {
                    e.stopPropagation();
                    const p =
                        PRODUCTS.find((x) => x.id === btn.dataset.wish) ||
                        wishlist.find((x) => x.id === btn.dataset.wish);
                    if (p) toggleWish(p);
                });
            });
            document.querySelectorAll("[data-qty-up]").forEach((btn) => {
                btn.addEventListener("click", () => {
                    const id = btn.dataset.qtyUp,
                        i = cart.find((x) => x.id === id);
                    if (i) setQty(id, i.qty + 1);
                });
            });
            document.querySelectorAll("[data-qty-down]").forEach((btn) => {
                btn.addEventListener("click", () => {
                    const id = btn.dataset.qtyDown,
                        i = cart.find((x) => x.id === id);
                    if (i) setQty(id, i.qty - 1);
                });
            });
            document.querySelectorAll("[data-remove]").forEach((btn) => {
                btn.addEventListener("click", () => removeCart(btn.dataset.remove));
            });
            document
                .getElementById("clear-cart-btn")
                ?.addEventListener("click", () => {
                    cart = [];
                    saveCart();
                    renderPage();
                    renderHeader();
                    showToast("Cart cleared");
                });

            // Category / sort (shop sidebar)
            document.querySelectorAll("[data-shop-cat]").forEach((btn) => {
                btn.addEventListener("click", () => {
                    shopCat = btn.dataset.shopCat;
                    drawerOpen = false;
                    renderPage();
                });
            });
            document.querySelectorAll("[data-sort]").forEach((btn) => {
                btn.addEventListener("click", () => {
                    shopSort = btn.dataset.sort;
                    drawerOpen = false;
                    renderPage();
                });
            });

            // Mobile filter drawer
            document
                .getElementById("filter-open-btn")
                ?.addEventListener("click", () => {
                    drawerOpen = true;
                    renderPage();
                });
            document
                .getElementById("drawer-close-btn")
                ?.addEventListener("click", () => {
                    drawerOpen = false;
                    renderPage();
                });
            document
                .getElementById("drawer-overlay")
                ?.addEventListener("click", () => {
                    drawerOpen = false;
                    renderPage();
                });
            document
                .getElementById("mobile-sort-sel")
                ?.addEventListener("change", (e) => {
                    shopSort = e.target.value;
                    renderPage();
                });

            // Forms
            document.getElementById("nl-form")?.addEventListener("submit", (e) => {
                e.preventDefault();
                showToast("Subscribed! Check your inbox 📬");
                e.target.reset();
            });
            document
                .getElementById("nl-form-j")
                ?.addEventListener("submit", (e) => {
                    e.preventDefault();
                    showToast("Subscribed! Check your inbox 📬");
                    e.target.reset();
                });
            document
                .getElementById("contact-form")
                ?.addEventListener("submit", (e) => {
                    e.preventDefault();
                    showToast("Message sent! We'll be in touch soon 💌");
                    e.target.reset();
                });
            document
                .getElementById("checkout-form")
                ?.addEventListener("submit", (e) => {
                    e.preventDefault();
                    cart = [];
                    saveCart();
                    nav("order");
                });

            // Breadcrumb nav
            document.querySelectorAll(".breadcrumb [data-nav]").forEach((el) => {
                el.addEventListener("click", () => nav(el.dataset.nav));
            });
            document
                .getElementById("pd-go-back")
                ?.addEventListener("click", () => nav("shop"));
        }

        // ============================================================
        //  SCROLL ANIMATIONS
        // ============================================================
        function animateVisible() {
            const els = document.querySelectorAll(
                ".fade-up, .fade-left, .fade-right",
            );
            const io = new IntersectionObserver(
                (entries) => {
                    entries.forEach((e) => {
                        if (e.isIntersecting) {
                            e.target.classList.add("vis");
                            io.unobserve(e.target);
                        }
                    });
                },
                { threshold: 0.12, rootMargin: "0px 0px -30px 0px" },
            );
            els.forEach((el) => io.observe(el));
            // Immediate check for already-visible elements
            setTimeout(() => {
                els.forEach((el) => {
                    const r = el.getBoundingClientRect();
                    if (r.top < window.innerHeight - 50) {
                        el.classList.add("vis");
                        io.unobserve(el);
                    }
                });
            }, 80);
        }

        // ============================================================
        //  BOOT
        // ============================================================
        render();
    </script>
